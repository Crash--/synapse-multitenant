[databases]
synapse_demo = host=postgres port=5432 dbname=synapse_demo

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 200
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
ignore_startup_parameters = extra_float_digits
admin_users = synapse
