server_name: localhost
pid_file: /data/homeserver.pid
web_client: false
soft_file_limit: 0
public_baseurl: http://localhost/
multi_tenant:
  enabled: true
  default_schema: public
tenants:
  - server_name: matrix.tenant-a.com
    database_schema: tenant_matrix_tenant_a_com
    signing_key_path: /keys/matrix_tenant-a_com.signing.key
    media_store_path: /media/tenant-a
    public_baseurl: http://matrix.tenant-a.com/
    registration_enabled: true
    registration_shared_secret: tenant_a_shared_secret_demo
    macaroon_secret_key: tenant_a_macaroon_demo
    form_secret: tenant_a_form_demo
    enable_federation: false
    ratelimit:
      rc_message:
        per_second: 10
        burst_count: 50
      rc_login:
        per_second: 10
        burst_count: 30
  - server_name: matrix.tenant-b.com
    database_schema: tenant_matrix_tenant_b_com
    signing_key_path: /keys/matrix_tenant-b_com.signing.key
    media_store_path: /media/tenant-b
    public_baseurl: http://matrix.tenant-b.com/
    registration_enabled: true
    registration_shared_secret: tenant_b_shared_secret_demo
    macaroon_secret_key: tenant_b_macaroon_demo
    form_secret: tenant_b_form_demo
    enable_federation: false
    ratelimit:
      rc_message:
        per_second: 2
        burst_count: 5
      rc_login:
        per_second: 2
        burst_count: 5
  - server_name: matrix.tenant-c.com
    database_schema: tenant_matrix_tenant_c_com
    signing_key_path: /keys/matrix_tenant-c_com.signing.key
    media_store_path: /media/matrix.tenant-c.com
    public_baseurl: http://matrix.tenant-c.com/
    registration_enabled: true
    registration_shared_secret: tenant_c_shared_secret_demo
    macaroon_secret_key: tenant_c_macaroon_demo
    form_secret: tenant_c_form_demo
    enable_federation: false
  - server_name: matrix.tenant-d.com
    database_schema: tenant_matrix_tenant_d_com
    signing_key_path: /keys/matrix_tenant-d_com.signing.key
    media_store_path: /media/matrix.tenant-d.com
    public_baseurl: http://matrix.tenant-d.com/
    registration_enabled: true
    registration_shared_secret: tenant_d_shared_secret_demo
    macaroon_secret_key: tenant_d_macaroon_demo
    form_secret: tenant_d_form_demo
    enable_federation: false
listeners:
  - port: 8008
    type: http
    tls: false
    x_forwarded: true
    bind_addresses:
      - 0.0.0.0
    resources:
      - names:
          - client
          - federation
        compress: false
database:
  name: psycopg2
  allow_unsafe_locale: true
  args:
    user: synapse
    password: synapse_password
    database: synapse_demo
    host: postgres
    port: 5432
    cp_min: 5
    cp_max: 10
log_config: /data/log.config
media_store_path: /media
max_upload_size: 50M
enable_registration: true
enable_registration_without_verification: true
registration_shared_secret: demo_shared_secret_change_in_production
signing_key_path: /keys/localhost.signing.key
suppress_key_server_warning: true
trusted_key_servers: []
macaroon_secret_key: demo_macaroon_secret_change_in_production
form_secret: demo_form_secret_change_in_production
rc_message:
  per_second: 5
  burst_count: 20
rc_registration:
  per_second: 5
  burst_count: 20
rc_login:
  address:
    per_second: 5
    burst_count: 20
  account:
    per_second: 5
    burst_count: 20
  failed_attempts:
    per_second: 5
    burst_count: 20
enable_metrics: false
report_stats: false
allow_guest_access: false
