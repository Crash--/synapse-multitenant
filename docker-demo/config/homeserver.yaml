server_name: localhost
pid_file: /data/homeserver.pid
web_client: false
soft_file_limit: 0
public_baseurl: http://localhost/

# Multi-tenant enabled; tenants loaded from public.tenants DB table
# (populated by the control plane at runtime).
multi_tenant:
  enabled: true
  default_schema: public
  source: database
  reload_secret: demo-reload-secret

# Demo only: accept any TLS cert on outbound federation. Sibling tenants
# present the mkcert wildcard cert, which the Synapse container does not
# trust by default. DO NOT use this in production.
federation_verify_certificates: false

# Serve /.well-known/matrix/server (tenant-aware from the ServerWellKnownResource
# change in this session). Remote servers discover the port via this.
serve_server_wellknown: true

listeners:
  - port: 8008
    type: http
    tls: false
    x_forwarded: true
    bind_addresses:
      - 0.0.0.0
    resources:
      - names:
          - client
          - federation
        compress: false
  - port: 9000
    type: metrics
    bind_addresses:
      - 0.0.0.0
database:
  name: psycopg2
  allow_unsafe_locale: true
  args:
    user: synapse
    password: synapse_password
    database: synapse_demo
    host: postgres
    port: 5432
    # Raised from 10 to support the density test (many tenants sharing
    # one pool). Pgbouncer default_pool_size=50 matches this ceiling.
    cp_min: 5
    cp_max: 50
log_config: /data/log.config
media_store_path: /media
max_upload_size: 50M
enable_registration: true
enable_registration_without_verification: true
registration_shared_secret: demo_shared_secret_change_in_production
signing_key_path: /keys/localhost.signing.key
suppress_key_server_warning: true
trusted_key_servers: []
macaroon_secret_key: demo_macaroon_secret_change_in_production
form_secret: demo_form_secret_change_in_production
rc_message:
  per_second: 5
  burst_count: 20
rc_registration:
  per_second: 5
  burst_count: 20
rc_login:
  address:
    per_second: 5
    burst_count: 20
  account:
    per_second: 5
    burst_count: 20
  failed_attempts:
    per_second: 5
    burst_count: 20
enable_metrics: true
report_stats: false
allow_guest_access: false
