# Multi-Tenant Synapse — 2-tenant Element demo
#
# Two minimalist Matrix homeservers served by a single Synapse process:
#   - matrix.tenant-a.com
#   - matrix.tenant-b.com
#
# Routing is handled by Traefik, which listens on the standard HTTP (80)
# and HTTPS (443) ports so Element can hit `http://matrix.tenant-a.com`
# without an explicit port suffix.
#
# Prerequisites
# =============
# 1. /etc/hosts entries so the tenant domains resolve to localhost:
#
#        127.0.0.1 matrix.tenant-a.com matrix.tenant-b.com matrix.tenant-c.com matrix.tenant-d.com
#
# 2. Nothing else listening on ports 80 / 443. The larger
#    `docker-multitenant/` dev rig binds port 80 by default — stop its
#    nginx (`docker stop synapse-mt-nginx`) before bringing the demo up.
#
# Optional TLS (mkcert)
# =====================
# To get green-padlock HTTPS (no browser warning), install mkcert
# (https://github.com/FiloSottile/mkcert), then from this directory:
#
#     mkcert -install                                           # once per machine
#     mkdir -p certs
#     mkcert -cert-file certs/tenants.crt \
#            -key-file  certs/tenants.key \
#            matrix.tenant-a.com matrix.tenant-b.com matrix.tenant-c.com matrix.tenant-d.com
#
# Traefik's file provider (`traefik/dynamic.yml`) will pick the cert up
# automatically on the next restart. Without it Traefik falls back to
# its built-in self-signed cert and the browser will warn once.
#
# Build the image
# ===============
# From the repo root (uses the standard Synapse Dockerfile — our fork's
# synapse/ directory already contains all multi-tenant patches):
#
#     DOCKER_BUILDKIT=1 docker build -t synapse:multi-tenant -f docker/Dockerfile .
#
# Bring up
# ========
#     docker compose up -d
#     docker compose logs -f synapse
#
# Run smoke tests (phases 1-6):
#     docker compose run test
#
# Tear down (wipes all state — Postgres runs on tmpfs):
#     docker compose down

services:
  # --- Reverse proxy -------------------------------------------------
  traefik:
    image: traefik:v2.11
    container_name: synapse-demo-traefik
    restart: unless-stopped
    command:
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.network=docker-demo_synapse-demo-net'
      - '--providers.file.directory=/etc/traefik/dynamic'
      - '--providers.file.watch=true'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--log.level=INFO'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    networks:
      - synapse-demo-net

  # --- Database ------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: synapse-demo-postgres
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_password
      POSTGRES_DB: synapse_demo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - synapse-demo-net

  # --- Connection pooler ---------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: synapse-demo-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer_userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U synapse -d synapse_demo || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - synapse-demo-net

  # --- One-shot bootstrap: keys + schemas ---------------------------
  keygen:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: synapse:multi-tenant
    container_name: synapse-demo-keygen
    user: root
    volumes:
      - ./data/keys:/keys
      - ./scripts:/scripts:ro
    environment:
      KEYS_DIR: "/keys"
      TENANTS: "localhost,matrix.tenant-a.com,matrix.tenant-b.com,matrix.tenant-c.com,matrix.tenant-d.com"
    entrypoint: ["python3", "/scripts/generate_keys.py"]
    networks:
      - synapse-demo-net

  init-schemas:
    image: synapse:multi-tenant
    container_name: synapse-demo-init-schemas
    depends_on:
      postgres:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_password
      POSTGRES_DB: synapse_demo
      TENANTS: "matrix.tenant-a.com,matrix.tenant-b.com,matrix.tenant-c.com,matrix.tenant-d.com"
    entrypoint: ["python3", "/scripts/init_schemas.py"]
    networks:
      - synapse-demo-net

  # --- Synapse -------------------------------------------------------
  synapse:
    image: synapse:multi-tenant
    container_name: synapse-demo-server
    depends_on:
      postgres:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully
      init-schemas:
        condition: service_completed_successfully
      traefik:
        condition: service_started
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      # Skip tenant schema isolation check on first boot — copy-schemas
      # clones the tables after Synapse creates them in public.
      SYNAPSE_SKIP_TENANT_ISOLATION_CHECK: "1"
    volumes:
      - ./config:/data:ro
      - ./data/keys:/keys:ro
      - ./data/media:/media
    labels:
      - 'traefik.enable=true'
      # Both tenant hostnames route to the same Synapse container.
      # Synapse itself resolves the tenant from the Host header that
      # Traefik forwards.
      - 'traefik.docker.network=docker-demo_synapse-demo-net'
      - 'traefik.http.routers.synapse.rule=Host(`matrix.tenant-a.com`) || Host(`matrix.tenant-b.com`) || Host(`matrix.tenant-c.com`) || Host(`matrix.tenant-d.com`)'
      - 'traefik.http.routers.synapse.entrypoints=web'
      - 'traefik.http.routers.synapse-tls.rule=Host(`matrix.tenant-a.com`) || Host(`matrix.tenant-b.com`) || Host(`matrix.tenant-c.com`) || Host(`matrix.tenant-d.com`)'
      - 'traefik.http.routers.synapse-tls.entrypoints=websecure'
      - 'traefik.http.routers.synapse-tls.tls=true'
      - 'traefik.http.services.synapse.loadbalancer.server.port=8008'
    networks:
      - synapse-demo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- Control Plane (tenant lifecycle API) --------------------------
  control-plane:
    build: ./control-plane
    container_name: synapse-demo-control-plane
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3001"
      DATABASE_URL: "postgresql://synapse:synapse_password@postgres:5432/synapse_demo"
      API_TOKEN: "demo-control-plane-token"
      TENANT_KEY_MASTER: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="   # 32 zero bytes — demo only!
      SYNAPSE_URL: "http://synapse:8008"
      SYNAPSE_RELOAD_SECRET: "demo-reload-secret"
      MEDIA_BASE_DIR: "/media"
    volumes:
      - ./data/media:/media
    ports:
      - '3001:3001'
    networks:
      - synapse-demo-net

  # --- Tenant Manager UI --------------------------------------------
  manager:
    build: ./manager
    container_name: synapse-demo-manager
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
      control-plane:
        condition: service_started
    environment:
      CONFIG_PATH: /synapse-config/homeserver.yaml
      KEYS_DIR: /keys
      MEDIA_DIR: /media
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_password
      POSTGRES_DB: synapse_demo
      SYNAPSE_CONTAINER: synapse-demo-server
      CONTROL_PLANE_URL: "http://control-plane:3001"
      CONTROL_PLANE_TOKEN: "demo-control-plane-token"
    volumes:
      - ./config:/synapse-config            # rw — manager appends tenants
      - ./data/keys:/keys                   # rw — manager generates signing keys
      - ./data/media:/media                 # rw — manager creates media dirs
      - /var/run/docker.sock:/var/run/docker.sock  # for SIGHUP via Docker API
    ports:
      - '3000:3000'
    networks:
      - synapse-demo-net

  # --- Smoke tests (phases 1-6) ------------------------------------
  test:
    image: synapse:multi-tenant
    container_name: synapse-demo-test
    profiles: ["test"]
    depends_on:
      synapse:
        condition: service_healthy
      copy-schemas:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["python3", "/scripts/test_tenants.py", "--host", "traefik"]
    networks:
      - synapse-demo-net

  # --- Clone public schema into each tenant_* schema ----------------
  # Without this step the tenant schemas exist but are empty and
  # Postgres' search_path falls back to `public`, so both tenants
  # would silently share the same tables.
  copy-schemas:
    image: synapse:multi-tenant
    container_name: synapse-demo-copy-schemas
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_password
      POSTGRES_DB: synapse_demo
    entrypoint: ["python3", "/scripts/copy_tenant_tables.py"]
    networks:
      - synapse-demo-net

  # --- Bootstrap admin user for the manager UI ----------------------
  bootstrap-admin:
    image: synapse:multi-tenant
    container_name: synapse-demo-bootstrap-admin
    depends_on:
      copy-schemas:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
    environment:
      SYNAPSE_HOST: "http://synapse:8008"
      TENANT_HOST: "matrix.tenant-a.com"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "admin"
      SHARED_SECRET: "demo_shared_secret_change_in_production"
    entrypoint: ["python3", "/scripts/bootstrap_admin.py"]
    networks:
      - synapse-demo-net

networks:
  synapse-demo-net:
    driver: bridge
