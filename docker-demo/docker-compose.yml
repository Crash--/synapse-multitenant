# Multi-Tenant Synapse — 2-tenant Element demo
#
# Two minimalist Matrix homeservers served by a single Synapse process:
#   - matrix.tenant-a.com
#   - matrix.tenant-b.com
#
# Routing is handled by Traefik, which listens on the standard HTTP (80)
# and HTTPS (443) ports so Element can hit `http://matrix.tenant-a.com`
# without an explicit port suffix.
#
# Prerequisites
# =============
# 1. /etc/hosts entries so the tenant domains resolve to localhost:
#
#        127.0.0.1 matrix.tenant-a.com matrix.tenant-b.com matrix.tenant-c.com matrix.tenant-d.com
#
# 2. Nothing else listening on ports 80 / 443. The larger
#    `docker-multitenant/` dev rig binds port 80 by default — stop its
#    nginx (`docker stop synapse-mt-nginx`) before bringing the demo up.
#
# Optional TLS (mkcert)
# =====================
# To get green-padlock HTTPS (no browser warning), install mkcert
# (https://github.com/FiloSottile/mkcert), then from this directory:
#
#     mkcert -install                                           # once per machine
#     mkdir -p certs
#     mkcert -cert-file certs/tenants.crt \
#            -key-file  certs/tenants.key \
#            matrix.tenant-a.com matrix.tenant-b.com matrix.tenant-c.com matrix.tenant-d.com
#
# Traefik's file provider (`traefik/dynamic.yml`) will pick the cert up
# automatically on the next restart. Without it Traefik falls back to
# its built-in self-signed cert and the browser will warn once.
#
# Build the image
# ===============
# From the repo root (uses the standard Synapse Dockerfile — our fork's
# synapse/ directory already contains all multi-tenant patches):
#
#     DOCKER_BUILDKIT=1 docker build -t synapse:multi-tenant -f docker/Dockerfile .
#
# Bring up
# ========
#     docker compose up -d
#     docker compose logs -f synapse
#
# Run smoke tests (phases 1-6):
#     docker compose run test
#
# Tear down (wipes all state — Postgres runs on tmpfs):
#     docker compose down

services:
  # --- DNS resolver --------------------------------------------------
  dnsmasq:
    image: strm/dnsmasq:latest
    container_name: synapse-demo-dnsmasq
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    networks:
      synapse-demo-net:
        # Pinned outside the default IPAM allocation range to avoid
        # races with unpinned services (postgres, pgbouncer, ...)
        # that would otherwise grab .0.2 first.
        ipv4_address: 172.28.0.254

  # --- Reverse proxy -------------------------------------------------
  traefik:
    image: traefik:v2.11
    container_name: synapse-demo-traefik
    restart: unless-stopped
    command:
      - '--providers.file.directory=/etc/traefik/dynamic'
      - '--providers.file.watch=true'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--log.level=INFO'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    networks:
      synapse-demo-net:
        # Pinned outside the default IPAM allocation range — dnsmasq
        # points *.localhost at this address so siblings loop through
        # the proxy for cross-tenant federation.
        ipv4_address: 172.28.0.253

  # --- LDAP directory ------------------------------------------------
  openldap:
    image: osixia/openldap:1.5.0
    container_name: synapse-demo-openldap
    environment:
      LDAP_ORGANISATION: "Demo Multi-Tenant Matrix"
      LDAP_DOMAIN: "demo.local"
      LDAP_BASE_DN: "dc=demo,dc=local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "admin"
      LDAP_TLS: "false"
      LDAP_READONLY_USER: "false"
    volumes:
      - ./openldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    command: --copy-service --loglevel info
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:389", "-b", "dc=demo,dc=local", "-D", "cn=admin,dc=demo,dc=local", "-w", "admin"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      synapse-demo-net:
        ipv4_address: 172.28.0.252

  # --- LemonLDAP-NG portal (OIDC provider) --------------------------
  lemonldap:
    # Use the "full" variant that's known to accept our config shape
    # (matches the llng-with-custom-skin example the user has working).
    # `full` includes portal + manager + handler; we only really need
    # portal but the full build is the one that boots cleanly with the
    # config file format we're writing.
    image: yadd/lemonldap-ng-full:latest
    container_name: synapse-demo-lemonldap
    depends_on:
      openldap:
        condition: service_healthy
    environment:
      SSODOMAIN: "localhost"
      PORTAL: "https://lemonldap.localhost/"
      LOGLEVEL: "info"
    volumes:
      - ./lemonldap/lmConf-1.json:/var/lib/lemonldap-ng/conf/lmConf-1.json:ro
    healthcheck:
      # Accept any HTTP response (2xx, 3xx, 4xx, 5xx): we just want to
      # know nginx is up. The baked config returns 302 on /.
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' http://localhost/ | grep -qE '^[0-9]+$'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - synapse-demo-net

  # --- OIDC proxy (single shared client for all tenants) ------------
  oidc-proxy:
    # Public Linagora image — don't vendor the source locally.
    # Upstream: https://github.com/linagora/twake-chat-oidc-proxy
    image: linagora/twake-chat-oidc-proxy:1.0.9
    container_name: synapse-demo-oidc-proxy
    depends_on:
      lemonldap:
        condition: service_healthy
    # Same dnsmasq pointer as synapse — needed to resolve *.localhost
    # to the traefik IP for the OIDC discovery call to LemonLDAP.
    dns:
      - 172.28.0.254
    environment:
      PORT: "3002"
      PROXY_URL: "https://oidc-proxy.localhost"
      OIDC_ISSUER_URL: "https://lemonldap.localhost/"
      OIDC_CLIENT_ID: "synapse-demo"
      OIDC_CLIENT_SECRET: "demo-secret-change-in-prod"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    networks:
      - synapse-demo-net

  # --- Database ------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: synapse-demo-postgres
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_password
      POSTGRES_DB: synapse_demo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - synapse-demo-net

  # --- Connection pooler ---------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: synapse-demo-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer_userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U synapse -d synapse_demo || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - synapse-demo-net

  # --- Synapse -------------------------------------------------------
  synapse:
    image: synapse:multi-tenant
    container_name: synapse-demo-server
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_started
    dns:
      - 172.28.0.254
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      # Skip tenant schema isolation check on first boot — copy-schemas
      # clones the tables after Synapse creates them in public.
      SYNAPSE_SKIP_TENANT_ISOLATION_CHECK: "1"
      # Master key for decrypting per-tenant signing keys from the DB
      # (phase 7). Must match control-plane's TENANT_KEY_MASTER.
      # 32 zero bytes — demo only!
      SYNAPSE_TENANT_KEY_MASTER: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    volumes:
      - ./config:/data:ro
      - ./data/keys:/keys:ro
      - ./data/media:/media
    networks:
      - synapse-demo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- Control Plane (tenant lifecycle API) --------------------------
  control-plane:
    build: ./control-plane
    container_name: synapse-demo-control-plane
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3001"
      DATABASE_URL: "postgresql://synapse:synapse_password@postgres:5432/synapse_demo"
      API_TOKEN: "demo-control-plane-token"
      TENANT_KEY_MASTER: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="   # 32 zero bytes — demo only!
      SYNAPSE_URL: "http://synapse:8008"
      SYNAPSE_RELOAD_SECRET: "demo-reload-secret"
      MEDIA_BASE_DIR: "/media"
    volumes:
      - ./data/media:/media
    networks:
      - synapse-demo-net

  # --- Tenant Manager UI --------------------------------------------
  manager:
    build: ./manager
    container_name: synapse-demo-manager
    depends_on:
      control-plane:
        condition: service_started
      openldap:
        condition: service_healthy
    environment:
      CONFIG_PATH: /synapse-config/homeserver.yaml
      KEYS_DIR: /keys
      MEDIA_DIR: /media
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_password
      POSTGRES_DB: synapse_demo
      SYNAPSE_CONTAINER: synapse-demo-server
      CONTROL_PLANE_URL: "http://control-plane:3001"
      CONTROL_PLANE_TOKEN: "demo-control-plane-token"
      LDAP_URL: "ldap://openldap:389"
      LDAP_ADMIN_DN: "cn=admin,dc=demo,dc=local"
      LDAP_ADMIN_PW: "admin"
      # Pre-hashed SSHA of password "demo" — generated at setup time.
      DEMO_USER_SSHA: "{SSHA}Dnd/fRooGjVUMuNihZnBBYFLOFRzgD1k"
      OIDC_CLIENT_ID: "synapse-demo"
      OIDC_CLIENT_SECRET: "demo-secret-change-in-prod"
      OIDC_ISSUER: "https://lemonldap.localhost/"
      OIDC_PROXY: "https://oidc-proxy.localhost"
    volumes:
      - ./config:/synapse-config            # rw — manager appends tenants
      - ./data/keys:/keys                   # rw — manager generates signing keys
      - ./data/media:/media                 # rw — manager creates media dirs
      - /var/run/docker.sock:/var/run/docker.sock  # for SIGHUP via Docker API
    networks:
      - synapse-demo-net

  # --- Smoke tests (phases 1-6) ------------------------------------
  test:
    image: synapse:multi-tenant
    container_name: synapse-demo-test
    profiles: ["test"]
    depends_on:
      synapse:
        condition: service_healthy
      copy-schemas:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["python3", "/scripts/test_tenants.py", "--host", "traefik"]
    networks:
      - synapse-demo-net

  # --- Clone public schema into each tenant_* schema ----------------
  # Without this step the tenant schemas exist but are empty and
  # Postgres' search_path falls back to `public`, so both tenants
  # would silently share the same tables.
  copy-schemas:
    image: synapse:multi-tenant
    container_name: synapse-demo-copy-schemas
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_password
      POSTGRES_DB: synapse_demo
    entrypoint: ["python3", "/scripts/copy_tenant_tables.py"]
    networks:
      - synapse-demo-net

networks:
  synapse-demo-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
