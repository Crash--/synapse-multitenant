; Minimal LemonLDAP-NG daemon config for the docker-demo.
; Points LLNG at the JSON-file config backend (lmConf-N.json files).
; The [all] section is the default — every LLNG component (handler,
; manager, portal) inherits these unless overridden in its own section.

[all]
configStorage = {'type' => 'File', 'dirName' => '/var/lib/lemonldap-ng/conf'}

[portal]
portalSkin = bootstrap

[handler]

[manager]
; Manager interface disabled at runtime — config is static.
protection = none
