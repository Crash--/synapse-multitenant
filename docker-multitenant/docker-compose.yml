# Multi-Tenant Synapse (REAL Synapse Build)
#
# This setup creates:
# - PostgreSQL with schemas for 3 tenants
# - REAL Synapse built from source with multi-tenant patches
# - Nginx reverse proxy routing by Host header
#
# Usage:
#   docker compose up -d --build
#
# Test:
#   curl -H "Host: acme.localhost" http://localhost/_matrix/client/versions
#   curl -H "Host: corp.localhost" http://localhost/_matrix/client/versions
#   curl -H "Host: startup.localhost" http://localhost/_matrix/client/versions

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: synapse-mt-postgres
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_password
      POSTGRES_DB: synapse_multitenant
    volumes:
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse_multitenant"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - synapse-net

  # Key Generator (runs once to create signing keys)
  # Uses the Synapse image which has signedjson pre-installed
  keygen:
    build:
      context: ..
      dockerfile: docker-multitenant/Dockerfile.real
    image: synapse-multitenant:latest
    container_name: synapse-mt-keygen
    user: root
    volumes:
      - ./data/keys:/keys
      - ./scripts:/scripts:ro
    environment:
      KEYS_DIR: "/keys"
    entrypoint: ["python3", "/scripts/generate_keys.py"]
    networks:
      - synapse-net

  # Tenant schema bootstrap.
  #
  # Runs AFTER synapse is healthy. Waits for the public schema to be
  # populated by Synapse's prepare_database, then clones public into
  # each tenant schema (with per-tenant sequences and column defaults)
  # using scripts/create_tenant_schema.py::clone_schema_with_sequences.
  #
  # See docker-multitenant/scripts/init_schemas.py for details.
  init-schemas:
    build:
      context: ..
      dockerfile: docker-multitenant/Dockerfile.real
    image: synapse-multitenant:latest
    container_name: synapse-mt-init-schemas
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      # Mount the repo-level scripts/ (create_tenant_schema.py lives
      # there) as a sibling of docker-multitenant scripts, and mount
      # the homeserver.yaml so init_schemas can read the authoritative
      # tenant schema names.
      - ../scripts:/src/scripts:ro
      - ./config:/data:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_password
      POSTGRES_DB: synapse_multitenant
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    entrypoint: ["python3", "/scripts/init_schemas.py"]
    networks:
      - synapse-net

  # Synapse Multi-Tenant Server (REAL Synapse)
  synapse:
    build:
      context: ..
      dockerfile: docker-multitenant/Dockerfile.real
    image: synapse-multitenant:latest
    container_name: synapse-mt-server
    depends_on:
      postgres:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./config:/data:ro
      - ./data/keys:/keys:ro
      - ./data/media:/media
      - ./data/logs:/var/log/synapse
      # --- Hot iteration mounts ---------------------------------------
      # These bind-mount the patched Python files from the local source
      # tree directly on top of the image, so editing a file + running
      # `docker compose restart synapse` is enough — no rebuild.
      # If you add a new patched file, add it to BOTH this list AND
      # docker-multitenant/Dockerfile.real.
      - ../synapse/tenant_context.py:/usr/local/lib/python3.13/site-packages/synapse/tenant_context.py:ro
      - ../synapse/tenant_registry.py:/usr/local/lib/python3.13/site-packages/synapse/tenant_registry.py:ro
      - ../synapse/tenant_background.py:/usr/local/lib/python3.13/site-packages/synapse/tenant_background.py:ro
      - ../synapse/handlers/user_directory.py:/usr/local/lib/python3.13/site-packages/synapse/handlers/user_directory.py:ro
      - ../synapse/handlers/stats.py:/usr/local/lib/python3.13/site-packages/synapse/handlers/stats.py:ro
      - ../synapse/handlers/pagination.py:/usr/local/lib/python3.13/site-packages/synapse/handlers/pagination.py:ro
      - ../synapse/config/tenants.py:/usr/local/lib/python3.13/site-packages/synapse/config/tenants.py:ro
      - ../synapse/rest/well_known.py:/usr/local/lib/python3.13/site-packages/synapse/rest/well_known.py:ro
      - ../synapse/http/site.py:/usr/local/lib/python3.13/site-packages/synapse/http/site.py:ro
      - ../synapse/storage/database.py:/usr/local/lib/python3.13/site-packages/synapse/storage/database.py:ro
      - ../synapse/storage/databases/main/__init__.py:/usr/local/lib/python3.13/site-packages/synapse/storage/databases/main/__init__.py:ro
      - ../synapse/storage/databases/state/store.py:/usr/local/lib/python3.13/site-packages/synapse/storage/databases/state/store.py:ro
      - ../synapse/handlers/register.py:/usr/local/lib/python3.13/site-packages/synapse/handlers/register.py:ro
      - ../synapse/handlers/room.py:/usr/local/lib/python3.13/site-packages/synapse/handlers/room.py:ro
      - ../synapse/server.py:/usr/local/lib/python3.13/site-packages/synapse/server.py:ro
      - ../synapse/events/builder.py:/usr/local/lib/python3.13/site-packages/synapse/events/builder.py:ro
      - ../synapse/media/multitenant_filepath.py:/usr/local/lib/python3.13/site-packages/synapse/media/multitenant_filepath.py:ro
      - ../synapse/crypto/multitenant_keyring.py:/usr/local/lib/python3.13/site-packages/synapse/crypto/multitenant_keyring.py:ro
      - ../synapse/config/homeserver.py:/usr/local/lib/python3.13/site-packages/synapse/config/homeserver.py:ro
      - ../synapse/rest/client/login.py:/usr/local/lib/python3.13/site-packages/synapse/rest/client/login.py:ro
      - ../synapse/handlers/auth.py:/usr/local/lib/python3.13/site-packages/synapse/handlers/auth.py:ro
      - ../synapse/handlers/account_validity.py:/usr/local/lib/python3.13/site-packages/synapse/handlers/account_validity.py:ro
      - ../synapse/handlers/deactivate_account.py:/usr/local/lib/python3.13/site-packages/synapse/handlers/deactivate_account.py:ro
      - ../synapse/handlers/device.py:/usr/local/lib/python3.13/site-packages/synapse/handlers/device.py:ro
      - ../synapse/handlers/message.py:/usr/local/lib/python3.13/site-packages/synapse/handlers/message.py:ro
    ports:
      - "8008:8008"
    networks:
      - synapse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: synapse-mt-nginx
    depends_on:
      synapse:
        condition: service_healthy
      init-schemas:
        condition: service_completed_successfully
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - synapse-net

  # Prometheus — scrapes Synapse metrics so the test container (and a
  # human at http://localhost:9090) can verify per-tenant labels are
  # present on request counters, DB query timings, etc.
  prometheus:
    image: prom/prometheus:latest
    container_name: synapse-mt-prometheus
    depends_on:
      synapse:
        condition: service_healthy
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - synapse-net

  # Test Runner (optional - run with: docker compose run test)
  test:
    image: python:3.11-slim
    container_name: synapse-mt-test
    depends_on:
      synapse:
        condition: service_healthy
      init-schemas:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
      - ./data/logs:/synapse-logs:ro
    entrypoint: >
      sh -c "pip install -q requests &&
             python3 /scripts/test_tenants.py"
    networks:
      - synapse-net
    profiles:
      - test

networks:
  synapse-net:
    driver: bridge
