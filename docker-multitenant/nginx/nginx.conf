events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Upstream to Synapse
    upstream synapse {
        server synapse:8008;
    }

    # Main server - routes all tenants to Synapse
    server {
        listen 80;

        # Accept all hostnames (Synapse will route based on Host header)
        server_name acme.localhost corp.localhost startup.localhost _;

        # Pass the Host header to Synapse for tenant detection
        location / {
            proxy_pass http://synapse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for sync
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://synapse/health;
        }
    }

    # Federation port (optional)
    server {
        listen 8448;
        server_name acme.localhost corp.localhost startup.localhost _;

        location / {
            proxy_pass http://synapse;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
